<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="595pt" height="842pt" viewBox="0 0 595 842"><rect x="0" y="0" width="595" height="842" fill="white"/><text x="35" y="40" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">Final observations</text><text x="35" y="90.5" font-family="DejaVu Sans Mono" font-size="10">The second observation separates content</text><text x="35" y="105.5" font-family="DejaVu Sans Mono" font-size="10">from its position on the page. A</text><text x="35" y="120.5" font-family="DejaVu Sans Mono" font-size="10">sentence can occupy two lines without</text><text x="35" y="135.5" font-family="DejaVu Sans Mono" font-size="10">changing its words, but a missing line</text><text x="35" y="150.5" font-family="DejaVu Sans Mono" font-size="10">changes the result. Empty cells are</text><text x="35" y="165.5" font-family="DejaVu Sans Mono" font-size="10">present in the table and do not ask the</text><text x="35" y="180.5" font-family="DejaVu Sans Mono" font-size="10">reader to invent a measurement. The</text><text x="35" y="195.5" font-family="DejaVu Sans Mono" font-size="10">figure contains colored regions, axes</text><text x="35" y="210.5" font-family="DejaVu Sans Mono" font-size="10">and a legend. A matching filename cannot</text><text x="35" y="225.5" font-family="DejaVu Sans Mono" font-size="10">establish that those elements survived</text><text x="35" y="240.5" font-family="DejaVu Sans Mono" font-size="10">conversion.</text><text x="51" y="273.5" font-family="DejaVu Sans Mono" font-size="13">n</text><text x="51" y="293.0" font-family="DejaVu Sans Mono" font-size="13">∑ xᵢ</text><text x="51" y="312.5" font-family="DejaVu Sans Mono" font-size="13">i = 1</text><text x="51" y="358.0" font-family="DejaVu Sans Mono" font-size="13">a = 1</text><text x="51" y="377.5" font-family="DejaVu Sans Mono" font-size="13">b = −2</text><text x="331" y="90.5" font-family="DejaVu Sans Mono" font-size="13">0   −1</text><text x="331" y="110.0" font-family="DejaVu Sans Mono" font-size="13">2    3</text><path d="M 329 75.5 H 324 V 121.5 H 329" fill="none" stroke="black"/><path d="M 402 75.5 H 407 V 121.5 H 402" fill="none" stroke="black"/><text x="315" y="155.5" font-family="DejaVu Sans Mono" font-size="10">Distinct final value 92.06; no page may</text><text x="315" y="170.5" font-family="DejaVu Sans Mono" font-size="10">be omitted.</text><text x="315" y="203.5" font-family="DejaVu Sans Mono" font-size="10">Source target https://example.invalid/st</text><text x="315" y="218.5" font-family="DejaVu Sans Mono" font-size="10">udy?series=0012&amp;mode=a_b#note n1</text><text x="315" y="251.5" font-family="DejaVu Sans Mono" font-size="10">Synthetic Author. Column notebook, 2026.</text></svg>