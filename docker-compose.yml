# Configurazione statica candidata; V7/V8 e startup con pesi sono prove distinte.
services:
  marker-api:
    image: ${RUN_IMAGE_TAG:-markdown-for-llms-marker:cpu}
    build:
      context: ${RUN_IMAGE_CONTEXT:?contesto pubblico preparato richiesto}
      dockerfile: Dockerfile
      network: none
      additional_contexts:
        verified-wheels: ${RUN_VERIFIED_WHEELS:?wheel ABI hash-locked verificate richieste}
        verified-apt: ${RUN_VERIFIED_APT:?repository APT firmato verificato richiesto}
      args:
        PYTHON_IMAGE: ${RUN_PYTHON_IMAGE:?digest Python verificato richiesto}
        UV_IMAGE: ${RUN_UV_IMAGE:?digest uv verificato richiesto}
        APT_SNAPSHOT: ${RUN_APT_SNAPSHOT:?timestamp apt verificato richiesto}
        MARKER_EXTRA: marker-cpu
        HOST_NETNS: ${RUN_HOST_NETNS:?namespace host richiesto per R/D4 build}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TORCH_DEVICE: cpu
      TMPDIR: /data/tmp
    volumes:
      - marker_tmp:/data/tmp
      - marker_cache:/data/cache
      - marker_fonts:/data/fonts
      - ${RUN_DATA_ROOT:-.}/source_documents:/data/input:ro
    # Path candidati da verificare sul codice installato in V8; nessuno startup implicito.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 300s
    restart: "no"
volumes:
  marker_tmp:
  marker_cache:
  marker_fonts:
