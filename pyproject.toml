[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-for-llms"
version = "1.0.0"
description = "A pipeline for converting documents to LLM-ready Markdown"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31.0",
    "charset-normalizer>=3.5.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
app = ["fastapi==0.142.2", "uvicorn==0.54.0", "python-multipart", "markdown-it-py==4.0.0", "mdit-py-plugins==0.5.0", "pillow==10.4.0"]
engine = ["marker-pdf[full]==2.2.0", "surya-ocr==0.23.0", "indra-ocr==1.1.2", "pypdfium2==5.10.1", "torch==2.15.0", "torchvision==0.29.1", "markdown-it-py==4.0.0"]
bench = ["marker-pdf[full]==2.2.0", "surya-ocr==0.23.0", "indra-ocr==1.1.2", "pypdfium2==5.10.1", "torch==2.15.0", "torchvision==0.29.1", "markdown-it-py==4.0.0", "mdit-py-plugins==0.5.0"]
bench-cu132 = ["marker-pdf[full]==2.2.0", "surya-ocr==0.23.0", "torch==2.15.0", "torchvision==0.29.1", "markdown-it-py==4.0.0", "mdit-py-plugins==0.5.0"]

[project.scripts]
mdf = "markdown_for_llms.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0", "pytest-cov>=4.1.0", "pytest-mock>=3.11.0",
    "black>=23.0.0", "flake8>=6.0.0", "mypy>=1.5.0", "httpx",
]

[tool.setuptools]
packages = [
    "markdown_for_llms", "markdown_for_llms.engine", "markdown_for_llms.engines", "markdown_for_llms.bench",
    "markdown_for_llms.bench.readers", "markdown_for_llms.bench.adapters",
]
include-package-data = false

[tool.setuptools.package-data]
markdown_for_llms = ["web/*.html", "web/*.css", "web/*.js", "migrations/*.sql"]
"markdown_for_llms.engine" = ["data/*.json", "filters/*.lua"]
"markdown_for_llms.bench" = ["data/*.json"]

[tool.uv]
required-version = "==0.13.7"
python-downloads = "manual"
default-groups = []
build-constraint-dependencies = ["setuptools==84.0.0"]
reinstall-package = ["markdown-for-llms"]
no-build-package = ["marker-pdf"]
conflicts = [[{ extra = "engine" }, { extra = "bench-cu132" }], [{ extra = "bench" }, { extra = "bench-cu132" }]]

[tool.uv.sources]
torch = [
    { index = "torch-cpu", extra = "engine" },
    { index = "torch-cpu", extra = "bench" },
    { index = "torch-cu132", extra = "bench-cu132" },
]
torchvision = [
    { index = "torch-cpu", extra = "engine" },
    { index = "torch-cpu", extra = "bench" },
    { index = "torch-cu132", extra = "bench-cu132" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/governance"]
norecursedirs = [
    ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv", "node_modules",
    "temp", "tmp", "documentation/runs", ".venv", ".venv-python", ".venv-bench",
    ".cache", "__pycache__", ".git",
]

# EbookLib 0.18 metadata as observed in two wheels; ADR 0006 and addendum r008.
[[tool.uv.dependency-metadata]]
name = "ebooklib"
version = "0.18"
requires-dist = ["lxml", "six"]
