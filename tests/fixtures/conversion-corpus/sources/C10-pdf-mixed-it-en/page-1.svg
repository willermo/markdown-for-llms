<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="595pt" height="842pt" viewBox="0 0 595 842"><rect x="0" y="0" width="595" height="842" fill="white"/><text x="35" y="88" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">Pagina mista 1</text><text x="35" y="128.5" font-family="DejaVu Sans Mono" font-size="10">Il laboratorio immaginario osserva tre campioni senza collegamenti a dati personali.</text><text x="35" y="143.5" font-family="DejaVu Sans Mono" font-size="10">Ogni campione riceve una descrizione leggibile e un valore scritto con la sua forma</text><text x="35" y="158.5" font-family="DejaVu Sans Mono" font-size="10">originale. La misura 0012 identifica una serie, mentre −7 indica un cambiamento con</text><text x="35" y="173.5" font-family="DejaVu Sans Mono" font-size="10">segno. La virgola in 123,45 rimane parte del dato. Una revisione può correggere una</text><text x="35" y="188.5" font-family="DejaVu Sans Mono" font-size="10">trascrizione soltanto conservando il documento di partenza e il motivo della modifica.</text><text x="35" y="203.5" font-family="DejaVu Sans Mono" font-size="10">Valore unico 17,03.</text><text x="51" y="236.5" font-family="DejaVu Sans Mono" font-size="13">E = mc²</text><text x="51" y="282.0" font-family="DejaVu Sans Mono" font-size="13">a = 1</text><text x="51" y="301.5" font-family="DejaVu Sans Mono" font-size="13">b = −2</text><rect x="35.0" y="334.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="40.0" y="350.0" font-family="DejaVu Sans Mono" font-size="10">Codice</text><rect x="208.33333333333334" y="334.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="213.33333333333334" y="350.0" font-family="DejaVu Sans Mono" font-size="10">Valore</text><rect x="381.6666666666667" y="334.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="386.6666666666667" y="350.0" font-family="DejaVu Sans Mono" font-size="10">Nota</text><rect x="35.0" y="359.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="40.0" y="375.0" font-family="DejaVu Sans Mono" font-size="10">0012</text><rect x="208.33333333333334" y="359.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="213.33333333333334" y="375.0" font-family="DejaVu Sans Mono" font-size="10">0</text><rect x="381.6666666666667" y="359.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="386.6666666666667" y="375.0" font-family="DejaVu Sans Mono" font-size="10"></text><text x="35" y="401.0" font-family="DejaVu Sans Mono" font-size="10">Celle misurate</text><image x="35" y="424.0" width="180" height="105" xlink:href="figure-it.png"/><text x="35" y="539.0" font-family="DejaVu Sans Mono" font-size="10">Figura 1 — Tre regioni e assi del laboratorio.</text><text x="35" y="572.0" font-family="DejaVu Sans Mono" font-size="10">La fonte è visibile. https://example.invalid/ricerca?serie=0012&amp;mode=a_b#nota n1</text><text x="35" y="605.0" font-family="DejaVu Sans Mono" font-size="10">Nota esclusiva della regione 1: −5.</text></svg>