<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="595pt" height="842pt" viewBox="0 0 595 842"><rect x="0" y="0" width="595" height="842" fill="white"/><text x="35" y="40" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">Column experiment</text><text x="35" y="90.5" font-family="DejaVu Sans Mono" font-size="10">The imaginary laboratory records three</text><text x="35" y="105.5" font-family="DejaVu Sans Mono" font-size="10">samples without using personal records.</text><text x="35" y="120.5" font-family="DejaVu Sans Mono" font-size="10">Each sample has a readable description</text><text x="35" y="135.5" font-family="DejaVu Sans Mono" font-size="10">and a value in its original written</text><text x="35" y="150.5" font-family="DejaVu Sans Mono" font-size="10">form. The identifier 0012 names a</text><text x="35" y="165.5" font-family="DejaVu Sans Mono" font-size="10">series, while −7 records a signed</text><text x="35" y="180.5" font-family="DejaVu Sans Mono" font-size="10">change. The decimal point in 123.45</text><text x="35" y="195.5" font-family="DejaVu Sans Mono" font-size="10">remains part of the observation. A</text><text x="35" y="210.5" font-family="DejaVu Sans Mono" font-size="10">revision can correct a transcription</text><text x="35" y="225.5" font-family="DejaVu Sans Mono" font-size="10">only while retaining the original</text><text x="35" y="240.5" font-family="DejaVu Sans Mono" font-size="10">document and a reason for the change.</text><text x="51" y="273.5" font-family="DejaVu Sans Mono" font-size="13">E = mc²</text><text x="60" y="319.0" font-family="DejaVu Sans Mono" font-size="14">xᵢ + 1</text><line x1="50" y1="325.0" x2="133" y2="325.0" stroke="black" stroke-width="1"/><text x="82" y="344.0" font-family="DejaVu Sans Mono" font-size="14">2</text><rect x="315.0" y="77.5" width="81.66666666666667" height="25" fill="white" stroke="black"/><text x="320.0" y="93.5" font-family="DejaVu Sans Mono" font-size="10">Code</text><rect x="396.6666666666667" y="77.5" width="81.66666666666667" height="25" fill="white" stroke="black"/><text x="401.6666666666667" y="93.5" font-family="DejaVu Sans Mono" font-size="10">Value</text><rect x="478.33333333333337" y="77.5" width="81.66666666666667" height="25" fill="white" stroke="black"/><text x="483.33333333333337" y="93.5" font-family="DejaVu Sans Mono" font-size="10">Note</text><rect x="315.0" y="102.5" width="81.66666666666667" height="25" fill="white" stroke="black"/><text x="320.0" y="118.5" font-family="DejaVu Sans Mono" font-size="10">0012</text><rect x="396.6666666666667" y="102.5" width="81.66666666666667" height="25" fill="white" stroke="black"/><text x="401.6666666666667" y="118.5" font-family="DejaVu Sans Mono" font-size="10">0</text><rect x="478.33333333333337" y="102.5" width="81.66666666666667" height="25" fill="white" stroke="black"/><text x="483.33333333333337" y="118.5" font-family="DejaVu Sans Mono" font-size="10"></text><rect x="315.0" y="127.5" width="81.66666666666667" height="25" fill="white" stroke="black"/><text x="320.0" y="143.5" font-family="DejaVu Sans Mono" font-size="10">B</text><rect x="396.6666666666667" y="127.5" width="81.66666666666667" height="25" fill="white" stroke="black"/><text x="401.6666666666667" y="143.5" font-family="DejaVu Sans Mono" font-size="10">−7</text><rect x="478.33333333333337" y="127.5" width="81.66666666666667" height="25" fill="white" stroke="black"/><text x="483.33333333333337" y="143.5" font-family="DejaVu Sans Mono" font-size="10">123.45</text><text x="315" y="169.5" font-family="DejaVu Sans Mono" font-size="10">Measured cells</text><image x="315" y="192.5" width="180" height="105" xlink:href="figure-en.png"/><text x="315" y="307.5" font-family="DejaVu Sans Mono" font-size="10">Figure 1 — Three regions and laboratory</text><text x="315" y="322.5" font-family="DejaVu Sans Mono" font-size="10">axes.</text><text x="315" y="355.5" font-family="DejaVu Sans Mono" font-size="10">Distinct first page value 51.08.</text><text x="315" y="388.5" font-family="DejaVu Sans Mono" font-size="10">Note: the signed temperature is −3.</text></svg>