<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="595pt" height="842pt" viewBox="0 0 595 842"><rect x="0" y="0" width="595" height="842" fill="white"/><text x="35" y="88" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">Pagina mista 3</text><text x="35" y="128.5" font-family="DejaVu Sans Mono" font-size="10">Il laboratorio immaginario osserva tre campioni senza collegamenti a dati personali.</text><text x="35" y="143.5" font-family="DejaVu Sans Mono" font-size="10">Ogni campione riceve una descrizione leggibile e un valore scritto con la sua forma</text><text x="35" y="158.5" font-family="DejaVu Sans Mono" font-size="10">originale. La misura 0012 identifica una serie, mentre −7 indica un cambiamento con</text><text x="35" y="173.5" font-family="DejaVu Sans Mono" font-size="10">segno. La virgola in 123,45 rimane parte del dato. Una revisione può correggere una</text><text x="35" y="188.5" font-family="DejaVu Sans Mono" font-size="10">trascrizione soltanto conservando il documento di partenza e il motivo della modifica.</text><text x="35" y="203.5" font-family="DejaVu Sans Mono" font-size="10">Valore unico 37,03.</text><text x="51" y="236.5" font-family="DejaVu Sans Mono" font-size="13">E = mc²</text><text x="51" y="282.0" font-family="DejaVu Sans Mono" font-size="13">a = 1</text><text x="51" y="301.5" font-family="DejaVu Sans Mono" font-size="13">b = −2</text><image x="0" y="326.79999999999995" width="595" height="515.2" href="p3-lower.png"/></svg>