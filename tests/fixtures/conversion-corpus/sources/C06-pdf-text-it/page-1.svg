<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="595pt" height="842pt" viewBox="0 0 595 842"><rect x="0" y="0" width="595" height="842" fill="white"/><text x="35" y="88" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">Esperimento su due pagine</text><text x="35" y="128.5" font-family="DejaVu Sans Mono" font-size="10">Il laboratorio immaginario osserva tre campioni senza collegamenti a dati personali.</text><text x="35" y="143.5" font-family="DejaVu Sans Mono" font-size="10">Ogni campione riceve una descrizione leggibile e un valore scritto con la sua forma</text><text x="35" y="158.5" font-family="DejaVu Sans Mono" font-size="10">originale. La misura 0012 identifica una serie, mentre −7 indica un cambiamento con</text><text x="35" y="173.5" font-family="DejaVu Sans Mono" font-size="10">segno. La virgola in 123,45 rimane parte del dato. Una revisione può correggere una</text><text x="35" y="188.5" font-family="DejaVu Sans Mono" font-size="10">trascrizione soltanto conservando il documento di partenza e il motivo della modifica.</text><text x="51" y="221.5" font-family="DejaVu Sans Mono" font-size="13">E = mc²</text><text x="60" y="267.0" font-family="DejaVu Sans Mono" font-size="14">xᵢ + 1</text><line x1="50" y1="273.0" x2="133" y2="273.0" stroke="black" stroke-width="1"/><text x="82" y="292.0" font-family="DejaVu Sans Mono" font-size="14">2</text><rect x="35.0" y="318.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="40.0" y="334.0" font-family="DejaVu Sans Mono" font-size="10">Codice</text><rect x="208.33333333333334" y="318.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="213.33333333333334" y="334.0" font-family="DejaVu Sans Mono" font-size="10">Valore</text><rect x="381.6666666666667" y="318.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="386.6666666666667" y="334.0" font-family="DejaVu Sans Mono" font-size="10">Nota</text><rect x="35.0" y="343.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="40.0" y="359.0" font-family="DejaVu Sans Mono" font-size="10">0012</text><rect x="208.33333333333334" y="343.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="213.33333333333334" y="359.0" font-family="DejaVu Sans Mono" font-size="10">0</text><rect x="381.6666666666667" y="343.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="386.6666666666667" y="359.0" font-family="DejaVu Sans Mono" font-size="10"></text><rect x="35.0" y="368.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="40.0" y="384.0" font-family="DejaVu Sans Mono" font-size="10">B</text><rect x="208.33333333333334" y="368.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="213.33333333333334" y="384.0" font-family="DejaVu Sans Mono" font-size="10">−7</text><rect x="381.6666666666667" y="368.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="386.6666666666667" y="384.0" font-family="DejaVu Sans Mono" font-size="10">123,45</text><text x="35" y="410.0" font-family="DejaVu Sans Mono" font-size="10">Celle misurate</text><image x="35" y="433.0" width="180" height="105" xlink:href="figure-it.png"/><text x="35" y="548.0" font-family="DejaVu Sans Mono" font-size="10">Figura 1 — Tre regioni e assi del laboratorio.</text><text x="35" y="581.0" font-family="DejaVu Sans Mono" font-size="10">Valore esclusivo della prima pagina 51,08.</text><text x="35" y="614.0" font-family="DejaVu Sans Mono" font-size="10">Nota: la temperatura con segno è −3.</text></svg>