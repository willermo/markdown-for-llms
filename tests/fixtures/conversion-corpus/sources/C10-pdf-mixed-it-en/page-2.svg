<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="595pt" height="842pt" viewBox="0 0 595 842"><rect x="0" y="0" width="595" height="842" fill="white"/><text x="35" y="88" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold">Mixed page 2</text><text x="35" y="128.5" font-family="DejaVu Sans Mono" font-size="10">The imaginary laboratory records three samples without using personal records. Each</text><text x="35" y="143.5" font-family="DejaVu Sans Mono" font-size="10">sample has a readable description and a value in its original written form. The</text><text x="35" y="158.5" font-family="DejaVu Sans Mono" font-size="10">identifier 0012 names a series, while −7 records a signed change. The decimal point in</text><text x="35" y="173.5" font-family="DejaVu Sans Mono" font-size="10">123.45 remains part of the observation. A revision can correct a transcription only</text><text x="35" y="188.5" font-family="DejaVu Sans Mono" font-size="10">while retaining the original document and a reason for the change. Unique value 73.02.</text><text x="51" y="221.5" font-family="DejaVu Sans Mono" font-size="13">E = mc²</text><text x="51" y="267.0" font-family="DejaVu Sans Mono" font-size="13">0   −1</text><text x="51" y="286.5" font-family="DejaVu Sans Mono" font-size="13">2    3</text><path d="M 49 252.0 H 44 V 298.0 H 49" fill="none" stroke="black"/><path d="M 122 252.0 H 127 V 298.0 H 122" fill="none" stroke="black"/><rect x="35.0" y="319.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="40.0" y="335.0" font-family="DejaVu Sans Mono" font-size="10">Code</text><rect x="208.33333333333334" y="319.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="213.33333333333334" y="335.0" font-family="DejaVu Sans Mono" font-size="10">Value</text><rect x="381.6666666666667" y="319.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="386.6666666666667" y="335.0" font-family="DejaVu Sans Mono" font-size="10">Note</text><rect x="35.0" y="344.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="40.0" y="360.0" font-family="DejaVu Sans Mono" font-size="10">0012</text><rect x="208.33333333333334" y="344.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="213.33333333333334" y="360.0" font-family="DejaVu Sans Mono" font-size="10">0</text><rect x="381.6666666666667" y="344.0" width="173.33333333333334" height="25" fill="white" stroke="black"/><text x="386.6666666666667" y="360.0" font-family="DejaVu Sans Mono" font-size="10"></text><text x="35" y="386.0" font-family="DejaVu Sans Mono" font-size="10">Measured cells</text><image x="35" y="409.0" width="180" height="105" xlink:href="figure-en.png"/><text x="35" y="524.0" font-family="DejaVu Sans Mono" font-size="10">Figure 1 — Three regions and laboratory axes.</text><text x="35" y="557.0" font-family="DejaVu Sans Mono" font-size="10">The source is visible. https://example.invalid/study?series=0012&amp;mode=a_b#note n2</text><text x="35" y="590.0" font-family="DejaVu Sans Mono" font-size="10">A unique raster note 83.09.</text></svg>